<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do tempo</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body>
    <div class="card">
        <div class="pesquisar">
            <input type="text" placeholder="Digite o nome da cidade" spellcheck="false">
            <button type="button"><img src="./src/img/search.png"></button>
        </div>
        <div class="clima">
            <img src="./src/img/rain.png" class="weather-icon">
            <h1 class="temperatura">22°c</h1>
            <h2 class="cidade">Osasco</h2>
            <div class="detalhes">
                <div class="col">
                    <img src="./src/img/humidity.png" alt="">
                    <div>
                        <p class="umidade">50%</p>
                        <p>Umidade do ar</p>
                    </div>
                </div>
                <div class="col">
                    <img src="./src/img/wind.png" alt="">
                    <div>
                        <p class="vento">15 km/h</p>
                        <p>Vento</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="./src/js/script.js"></script>

</html>
