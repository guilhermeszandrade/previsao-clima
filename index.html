<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Clima</title>
    <link rel="stylesheet" href="./src/css/style.css">
</head>

<body>
    <div class="card">
        <div class="pesquisar">
            <input type="text" placeholder="Digite o nome da cidade" spellcheck="false">
            <button type="button"><img src="./src/img/search.png"></button>
        </div>
        <div class="clima">
            <img src="./src/img/rain.png" class="weather-icon">
            <h1 class="temperatura"></h1>
            <h2 class="cidade"></h2>
            <div class="detalhes">
                <div class="col">
                    <img src="./src/img/humidity.png" alt="">
                    <div>
                        <p class="umidade"></p>
                        <p></p>
                    </div>
                </div>
                <div class="col">
                    <img src="./src/img/wind.png" alt="">
                    <div>
                        <p class="vento"></p>
                        <p></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./src/js/script.js"></script>
</body>
</html>
